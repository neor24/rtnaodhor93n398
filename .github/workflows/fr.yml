      - name: Run Script and Generate M3U for CNN Turk
        run: |
          set -euo pipefail
          if [ -f "py/videocnnturk.py" ]; then
            python3 py/videocnnturk.py > ar/videocnnturk_url.txt
            {
              echo "#EXTM3U"
              echo "#EXTINF:-1, CNN Turk"
              cat ar/videocnnturk_url.txt
            } > ar/videocnnturk.m3u
            rm ar/videocnnturk_url.txt
          else
            echo "Fichier py/videocnnturk.py non trouvé"
            exit 1
          fi

      - name: Pull latest changes from remote
        run: |
          git pull origin main --no-rebase --no-edit

      - name: Commit and Push Changes
        run: |
          git config --local user.email "hello@github.com"
          git config --local user.name "hello"
          git add fr/ ar/
          if ! git diff --staged --quiet; then
            git commit -m "Update M3U8 files - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes to commit"
          fi
