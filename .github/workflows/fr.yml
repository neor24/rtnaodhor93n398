name: Run Script Every 6 Hours FR

on:
  schedule:
    - cron: '0 */6 * * *'  # Toutes les 6 heures
  workflow_dispatch:        # Déclenchement manuel

permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Nécessaire pour un pull/push fiable

      - name: Create Required Folders
        run: mkdir -p fr txt ar py

      - name: Run Script and Generate M3U8 for VideoLEQUIPE
        run: |
          set -euo pipefail
          curl_output=$(curl -k -s -H "User-Agent: Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.6533.103 Mobile Safari/537.36" "https://callofliberty.fr/tv/21-LEQUIPE/21-LEQUIPE.php" | tr -d '\n' | grep -oP "source:\s*'\K[^']+")
          if [ -n "$curl_output" ]; then
            curl -k -e "https://callofliberty.fr/" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.6533.103 Mobile Safari/537.36" -H "Origin: https://callofliberty.fr" "$curl_output" > fr/videolequipe.m3u8
          else
            echo "Erreur: URL source non trouvée pour LEQUIPE"
            exit 1
          fi

      - name: Run Script and Generate M3U8 for VideoFR3
        run: |
          set -euo pipefail
          curl_output=$(curl -k -s -H "User-Agent: Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.6533.103 Mobile Safari/537.36" "https://callofliberty.fr/tv/232-france.3hautenormandie/232-france.3hautenormandie.php" | tr -d '\n' | grep -oP "source:\s*'\K[^']+")
          if [ -n "$curl_output" ]; then
            echo "URL source: $curl_output"
            curl -k -e "https://callofliberty.fr/" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.6533.103 Mobile Safari/537.36" -H "Origin: https://callofliberty.fr" "$curl_output" -o fr/videofr3_temp.m3u8
            
            # Nettoyer le proxy HLS-AES
            if [ -f "fr/videofr3_temp.m3u8" ]; then
              sed 's|https://s2.callofliberty.fr/tv/proxy/HLS-AES/||g' fr/videofr3_temp.m3u8 > fr/videofr3.m3u8
              if [ ! -s fr/videofr3.m3u8 ]; then
                echo "Erreur: Le fichier nettoyé est vide"
                exit 1
              fi
              echo "Vérification du nettoyage:"
              head -3 fr/videofr3.m3u8
              rm -f fr/videofr3_temp.m3u8
              echo "FR3 généré et nettoyé"
            else
              echo "Fichier temporaire non créé"
              exit 1
            fi
          else
            echo "Erreur: URL source non trouvée pour FR3"
            exit 1
          fi

